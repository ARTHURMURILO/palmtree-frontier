# region Class 4
# Severe heavy hardware: 100+ damage, advanced weapons, heavy combat gear.
- type: entity
  id: BaseC4Contraband
  abstract: true
  components:
  - type: Contraband
    severity: Class4
    allowedDepartments: []
    turnInValues: *noFUCs

- type: entity
  parent: BaseC4Contraband
  id: BaseC4ContrabandUnredeemable
  abstract: true
# endregion

# region Class 5
# Strictly military and law-enforcement hardware. NFSD/Security may carry it as issued equipment;
# civilians can never be permitted to possess it.
- type: entity
  parent: BaseC3Contraband
  id: BaseC5Contraband
  abstract: true
  components:
  - type: Contraband
    severity: Class5
    allowedDepartments: [ Security ]

- type: entity
  parent: BaseC5Contraband
  id: BaseC5ContrabandUnredeemable
  abstract: true
  components:
  - type: Contraband
    turnInValues: *noFUCs
# endregion

# region Class 3 Mobs
- type: entity
  parent: BaseC3Contraband
  id: BaseC3MobHuman # For people (should be sapients, humanoids)
  abstract: true
  components:
  - type: Contraband
    severity: FrontierLawNotice
    hideCarryStatus: true
    turnInValues: *noFUCs

- type: entity
  parent: BaseC3Contraband
  id: BaseC3MobCreature # For non-humanoid/non-sapient beasts
  abstract: true
  components:
