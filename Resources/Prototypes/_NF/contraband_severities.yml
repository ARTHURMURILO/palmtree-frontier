# Tier 1 - minor restricted items; a permit is required, but enforcement is low priority.
- type: contrabandSeverity
  id: Class1
  examineText: contraband-examine-text-Class1

# Tier 2 - civilian lethal items and restricted gear; a permit is required.
# Permit-only items have no department exemption, so this severity does not show a department/job list.
- type: contrabandSeverity
  id: Class2
  examineText: contraband-examine-text-Class2

# Tier 2 gear that is restricted to specific departments/jobs (e.g. NFSD equipment).
- type: contrabandSeverity
  id: Class2Restricted
  examineText: contraband-examine-text-Class2
  showDepartmentsAndJobs: true

- type: contrabandSeverity
  id: Class2Expedition
  examineText: contraband-examine-text-Class2Expedition

# Tier 3 - serious military-style, restricted, or hazardous items.
- type: contrabandSeverity
  id: Class3General
  examineText: contraband-examine-text-Class3General

- type: contrabandSeverity
  id: Class3Cult
  examineText: contraband-examine-text-Class3Cult

- type: contrabandSeverity
  id: Class3Pirate
  examineText: contraband-examine-text-Class3Pirate

- type: contrabandSeverity
  id: Class3Syndicate
  examineText: contraband-examine-text-Class3Syndicate

- type: contrabandSeverity
  id: Class3Wizard
  examineText: contraband-examine-text-Class3Wizard

- type: contrabandSeverity
  id: Class3Expedition
  examineText: contraband-examine-text-Class3Expedition

# Class 4 - 100+ damage heavy hardware; permit required, arrestable without permit.
- type: contrabandSeverity
  id: Class4
  examineText: contraband-examine-text-Class4

# Class 5 - strictly military and law-enforcement hardware, completely illegal for civilians.
- type: contrabandSeverity
  id: Class5
  examineText: contraband-examine-text-Class5

# Notice of Frontier law for dangerous captives. This is not a contraband tier.
- type: contrabandSeverity
  id: FrontierLawNotice
  examineText: contraband-examine-text-FrontierLawNotice

# Class 3 contraband - mobs are handled by the Frontier Sector Code notice, not a contraband tier.

# Not necessarily contraband, but items of interest to pirates.
- type: contrabandSeverity
  id: PirateTarget
  examineText: contraband-examine-text-PirateTarget
