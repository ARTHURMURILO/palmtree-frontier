- type: constructionGraph
  id: GasBinaryStarlight
  start: start
  graph:
    - node: start
      edges:
      # connector port
      - to: portAlt1
        steps:
        - material: Steel
          amount: 2
          doAfter: 1

      - to: portAlt2
        steps:
        - material: Steel
          amount: 2
          doAfter: 1

      # dual port vent
      - to: dualportventpumpAlt1
