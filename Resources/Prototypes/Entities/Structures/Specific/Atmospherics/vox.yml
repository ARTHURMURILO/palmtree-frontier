- type: entity
  abstract: true
  parent: AirSensorBase
  id: AirSensorVoxBase
  suffix: Vox Atmosphere
  components:
  - type: AtmosMonitor
    gasThresholdPrototypes:
      Oxygen: voxOxygen
      Nitrogen: voxNitrogen
      CarbonDioxide: stationCO2
      Plasma: stationPlasma
      Tritium: stationTritium
      WaterVapor: stationWaterVapor
      Ammonia: stationAmmonia
      NitrousOxide: stationNO
      Frezon: danger
      Respiron: ignore # Frontier
      Helium: stationHe # Frontier
      BZ: stationBZ # Funky - /tg/ gases
      Healium: stationHealium # Funky - /tg/ gases
      Nitrium: voxNitrium # Funky - /tg/ gases
      Pluoxium: stationPluoxium # Funky - /tg/ gases
      Hydrogen: danger # Funky - /tg/ gases
      HyperNoblium: stationHyperNoblium # Funky - /tg/ gases
      ProtoNitrate: danger # Funky - /tg/ gases
      Zauker: danger # Funky - /tg/ gases
      Halon: voxHalon # Funky - /tg/ gases
      AntiNoblium: danger # Funky - /tg/ gases

- type: entity
  parent: [AirSensorVoxBase, AirSensor]
  id: AirSensorVox

- type: entity
  parent: [AirSensorVoxBase, GasVentPump]
  id: GasVentPumpVox

- type: entity
  parent: [AirSensorVoxBase, GasVentScrubber]
  id: GasVentScrubberVox
  components:
  - type: GasVentScrubber
    wideNet: true # Air alarm with auto mode overrides filters with hardcoded defaults so default to widenet
    filterGases:
    - Oxygen # filter out oxygen as well as regular harmful gases
    - CarbonDioxide
    - Plasma
    - Tritium
    - WaterVapor
    - Ammonia
    - NitrousOxide
    - Frezon
    - Helium # Frontier

# use this to prevent overriding filters with hardcoded defaults
- type: entity
  parent: AirAlarm
  id: AirAlarmVox
  suffix: Vox Atmosphere, auto mode disabled
  components:
  - type: AirAlarm
    autoMode: false
