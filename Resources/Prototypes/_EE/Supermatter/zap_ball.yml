# Palmtree: the small tesla balls that a supermatter throws after a failure.
# This is deliberately based on BaseEnergyBall rather than TeslaMiniEnergyBall:
# the mini ball inherits DangerTethered, which would make it disappear on a ship.
- type: entity
  parent: BaseEnergyBall
  id: SupermatterZapBall
  name: supermatter energy ball
  description: A short-lived knot of supermatter discharge.
  categories: [ HideSpawnMenu ]
  components:
  - type: SupermatterZapBall
  - type: TimedDespawn
    lifetime: 30
  - type: Electrified
    requirePower: false
  - type: Fixtures
    fixtures:
      TeslaCollider:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: true
        restitution: 0.8
        density: 10
        mask:
        - None
        layer:
        - None
  - type: Sprite
    drawdepth: Effects
    sprite: Structures/Power/Generation/Tesla/energy_miniball.rsi
    layers:
    - state: tesla_projectile
      shader: unshaded
