# Goobstation - supermatter
#
# Ported from Goobstation. Stripped for Palmtree:
#   - PhysicsGunBlacklist (Goob _Shitcode component)
#   - LanguageSpeaker / LanguageKnowledge (Einstein Engines language system)

- type: entity
  id: Supermatter
  name: supermatter crystal
  description: A strangely translucent and iridescent crystal.
  placement:
    mode: SnapgridCenter
  components:
    - type: Supermatter
      radiationOutputFactor: 0.005
      whitelist:
        tags:
          - EmitterBolt
        components:
          - Body
          - Item
      # Palmtree: the collapse has to leave a hole behind, not a hole that evaporates three minutes
      # later. See SupermatterSingularity at the bottom of this file.
      singularitySpawnPrototype: SupermatterSingularity
    - type: RadiationSource
    - type: AmbientSound
      range: 5
      volume: 0
      sound:
        path: /Audio/_Goobstation/Supermatter/calm.ogg
    - type: Physics
    - type: Speech
      speechSounds: Pai
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.25,-0.25,0.25,0.25"
          mask:
            - Impassable
            - MidImpassable
            - HighImpassable
            - LowImpassable
            - InteractImpassable
            - Opaque
          layer:
            - MidImpassable
            - HighImpassable
            - BulletImpassable
            - InteractImpassable
    - type: Transform
      anchored: true
      noRot: true
    - type: CollisionWake
      enabled: false
    - type: Clickable
    - type: InteractionOutline
    - type: Sprite
      drawdepth: WallMountedItems
      sprite: _Goobstation/Supermatter/supermatter.rsi
      state: supermatter
    - type: Icon
      sprite: _Goobstation/Supermatter/supermatter.rsi
      state: supermatter
    - type: PointLight
      enabled: true
      radius: 10
      energy: 5
      color: "#ffe000"
    - type: Explosive
      explosionType: Supermatter
      maxIntensity: 10000
      intensitySlope: 5
      totalIntensity: 10000
    - type: GuideHelp
      guides: [ Supermatter ]
    - type: WarpPoint
      follow: true
      location: supermatter
    - type: StealTarget
      stealGroup: SupermatterSliver # uses to verify sm existense on map
    # Palmtree: reports go out on the Shortband, which RadioSystem will not carry across a map
    # without a powered telecomms relay. A ship's engine room rarely has one, so the crystal carries
    # its own pass instead of going silent the moment it starts failing.
    - type: TelecomExempt
    # Palmtree: admins inspecting a crystal (an admin ghost clicking it) get the monitoring window
    # focused on the crystal itself, instead of being consumed by the hand-interact. The console
    # component is what feeds that window; it is opened programmatically, never on normal use.
    - type: SupermatterConsole
    - type: UserInterface
      interfaces:
        enum.SupermatterConsoleUiKey.Key:
          type: SupermatterConsoleBoundUserInterface

# Palmtree: the smaller crystal, for ships that do not have a whole engine deck to give it.
#
# The art is tgstation's `sm_small` set (32x48, crystal on a mounting frame) from
# icons/obj/machines/engine/supermatter.dmi - the same golden crystal family as the full-size sprite
# this fork already ships, so the two read as different sizes of the same machine.
#
# Functionally it is the same crystal as `Supermatter`: same output, same failure points, same four
# ways to fail. Only the housing differs. That is deliberate - it is a mounting option, not a
# weaker engine, so nobody has to re-learn the machine to use one.
#
# It is also the only one you can move. The full crystal is welded to the deck for its whole life
# (`anchored: true`, no `Anchorable`); the shard ships unanchored, can be wrenched down wherever it
# lands, and can be dragged around beforehand. That is what makes it something you can buy, carry
# aboard and install yourself.
- type: entity
  parent: Supermatter
  id: SupermatterSmall
  name: supermatter shard
  description: A supermatter crystal in a compact mounting frame. Smaller than the real thing, and no safer.
  components:
    - type: Transform
      anchored: false
      noRot: true
    # Default flags: anchorable *and* unanchorable, so it can be fitted, moved and refitted.
    - type: Anchorable
      delay: 2
    # Dragging is pull-based in SS14 and pulling requires this component. The crystal's parents are
    # a bare entity prototype, so unlike every item and structure it never inherited `Pullable` -
    # the shard could be wrenched down and then never actually moved.
    - type: Pullable
    # The parent's Physics has the engine default body type (Static), which `CanPull` rejects.
    # The anchoring system only flips a body to Dynamic when it is unanchored by hand, so a shard
    # that spawned unanchored could not be dragged until it was wrenched down and back up.
    - type: Physics
      bodyType: Dynamic
    - type: Sprite
      drawdepth: WallMountedItems
      sprite: _Goobstation/Supermatter/supermatter_small.rsi
      state: shard
    - type: Icon
      sprite: _Goobstation/Supermatter/supermatter_small.rsi
      state: shard
    # The monitoring console draws each crystal with its own art; the server cannot read the
    # client-only sprite component, so the shard names its own icon here.
    - type: Supermatter
      consoleIcon: { sprite: _Goobstation/Supermatter/supermatter_small.rsi, state: shard }

# Flatpack version, so it can be sold through the cargo market like every other ship engine.
- type: entity
  parent: BaseNFFlatpack
  id: SupermatterSmallFlatpack
  name: supermatter shard flatpack
  description: A flatpack used for constructing a supermatter shard. Handle with the same care as the real thing.
  components:
  - type: Flatpack
    entity: SupermatterSmall
  - type: Sprite
    sprite: _NF/Objects/Devices/flatpack.rsi
    layers:
    - state: power_generator

- type: entity
  parent: BaseItem
  id: SupermatterSliver
  name: supermatter sliver
  description: A shard from the station's supermatter crystal. Highly radioactive.
  components:
    - type: PointLight
      enabled: true
      radius: 3
      energy: 2
      color: "#fff633"
    - type: RadiationSource
      intensity: .75
    - type: Icon
      sprite: _Goobstation/Supermatter/supermatter_sliver.rsi
      state: icon
    - type: Sprite
      sprite: _Goobstation/Supermatter/supermatter_sliver.rsi
      state: icon
    - type: StealTarget
      stealGroup: SupermatterSliver
    - type: Tag
      tags:
        - HighRiskItem
    - type: SupermatterImmune

# Palmtree: what a gravitational collapse actually leaves behind.
#
# The stock `Singularity` carries 180 energy and sheds one per second, so a hole that finds nothing
# to eat in space dissipates on its own after three minutes. That is fine for a station where the
# singularity is supposed to be contained anyway; it is not fine for the one failure mode whose whole
# point is the hole. This variant keeps its energy, grows as it eats, and is only removed when it
# wanders far enough from the ship for the danger tether to claim it.
- type: entity
  id: SupermatterSingularity
  parent: Singularity
  categories: [ HideSpawnMenu ]
  components:
  - type: Singularity
    energyLoss: 0
