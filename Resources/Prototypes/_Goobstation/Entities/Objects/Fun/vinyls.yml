# SPDX-License-Identifier: AGPL-3.0-or-later
# Vinyl disks made from music Palmtree already ships (Lobby / Jukebox / _PS Lobby).
# No new audio was added: every song path below points at an .ogg already in this repo.
# Prototype shape ported from Goob Station (_Goobstation/Entities/Objects/Fun/vinyls.yml).

- type: entity
  abstract: true
  id: BaseVinylDisk
  name: vinyl disk
  description: A vinyl disk containing music.
  parent: BaseItem
  components:
  - type: Vinyl
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/RadioStation/vinyls.rsi
    state: red-vinyl-disk
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylDiskBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 5

- type: entity
  id: VinylDiskBroken
  parent: BaseItem
  name: broken vinyl disk
  description: Someone's favourite song, snapped in half.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/RadioStation/vinyls.rsi
    state: broken-vinyl-disk
  - type: Tag
    tags:
    - Trash

