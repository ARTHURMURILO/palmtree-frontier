# SPDX-License-Identifier: AGPL-3.0-or-later
# Palmtree: vinyl disks for the jukebox/record player. Each one is a regular Frontier
# record (`JukeboxContainer`) carrying a single track, so it works in the jukebox, the
# vinyl player and the CD rack alike.
# No new audio was added: every track below is an .ogg that already ships with the repo.
# Sprites ported from Goob Station (_Goobstation/Objects/Misc/RadioStation/vinyls.rsi).

- type: entity
  abstract: true
  id: BaseVinylDisk
  name: vinyl disk
  description: A vinyl disk containing music.
  parent: BaseRecord
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Misc/RadioStation/vinyls.rsi
    state: red-vinyl-disk
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/star_hit.ogg
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 12
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          VinylDiskBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 5

