# Ported from Goob Station (_Goobstation/Entities/Structures/Decorations/barrels.yml).

- type: entity
  id: BlackBarrelBase
  parent: BaseStructureDynamic
  name: black barrel
  description: Do a barrel roll!
  components:
  - type: Construction
    graph: Barrel
    node: barrelSteel
  - type: Anchorable
  - type: Sprite
    noRot: true
    sprite: _Goobstation/Structures/Decoration/Barrels/blackbarrel.rsi
    state: barrel
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Pullable
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel1:
              min: 2
              max: 4
        - !type:DoActsBehavior
          acts: [ "Destruction" ]

- type: entity
  id: BarrelPlanks
  parent: BlackBarrelBase
  components:
  - type: Construction
    graph: Barrel
    node: barrelPlanks
  - type: Sprite
    noRot: true
    sprite: _Goobstation/Structures/Decoration/Barrels/blackbarrel.rsi
    state: barrel_planks
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            MaterialWoodPlank1:
              min: 2
              max: 4
        - !type:DoActsBehavior
          acts: [ "Destruction" ]

- type: entity
  id: BarrelFire
  parent: BlackBarrelBase
  name: barrel fire
  description: Perfectly warm for the perfectly jobless!
  components:
  - type: Construction
    graph: Barrel
    node: barrelFire
  - type: Sprite
    noRot: true
    sprite: _Goobstation/Structures/Decoration/Barrels/blackbarrel.rsi
    state: barrel_fire
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 80
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel1:
              min: 2
              max: 4
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: AlwaysHot
