# Ported from Goob Station (_Goobstation/Entities/Structures/Decorations/vase.yml).
# Palmtree: names added per flower variety so the construction menu reads well.

- type: entity
  id: VaseBase
  parent: [DrinkBaseMaterialGlass, DrinkBase]
  name: vase
  description: It's a vase. It holds flowers.
  abstract: true
  components:
  - type: Anchorable
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 30
        reagents:
        - ReagentId: Water
          Quantity: 30
  - type: Sprite
    sprite: _Goobstation/Structures/Decoration/vase.rsi
    state: vase-0

- type: entity
  id: VasePlant0
  parent: VaseBase
  name: empty vase
  description: It's a vase. It holds flowers. This one is empty.
  components:
  - type: Construction
    graph: Vase
    node: vaseEmpty
  - type: Sprite
    state: vase-0

