# Ported from Goob Station (_Goobstation/Entities/Structures/Decorations/desktop.yml).
# Palmtree: the boot-up ambient sound used Goob audio, so it was dropped.

- type: entity
  id: Desktop
  parent: BaseStructure
  name: desktop computer
  description: The screen says to hold for the OS to update. Though the progress bar never seems to move.
  placement:
    mode: SnapgridCenter
  components:
  - type: Construction
    graph: DesktopComputer
    node: desktopComputer
  - type: Sprite
    noRot: true
    sprite: _Goobstation/Structures/Decoration/desktop.rsi
    state: desktop
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
  - type: PointLight
    radius: 3
    energy: 2
    color: "#2789CD"
