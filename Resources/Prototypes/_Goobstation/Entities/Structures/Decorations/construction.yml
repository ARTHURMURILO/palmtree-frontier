# Ported from Goob Station (_Goobstation/Entities/Structures/Decorations/construction.yml).

- type: entity
  id: ConstructionBarricade
  parent: BaseStructure
  name: construction barricade
  description: Wear your helmet!
  components:
  - type: Construction
    graph: ConstructionBarricade
    node: constructionBarricade
  - type: Anchorable
  - type: Sprite
    noRot: true
    sprite: _Goobstation/Structures/Decoration/construction.rsi
    state: construction
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Pullable
  - type: Climbable
    delay: 5.0
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 60
        behaviors:
        - !type:SpawnEntitiesBehavior
          spawn:
            SheetSteel1:
              min: 1
              max: 2
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
