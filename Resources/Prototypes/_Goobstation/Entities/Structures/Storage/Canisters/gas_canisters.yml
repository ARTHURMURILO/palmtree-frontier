# Goobstation - /tg/ gas canisters
#
# Palmtree gas index map:
#   0 oxygen, 1 nitrogen, 2 carbon dioxide, 3 plasma, 4 tritium, 5 water vapor,
#   6 ammonia, 7 nitrous oxide, 8 frezon, 9 respiron, 10 helium,
#   11 BZ, 12 healium, 13 nitrium, 14 pluoxium

- type: entity
  parent: GasCanister
  id: BZCanister
  name: bz canister
  description: A canister that can contain any type of gas. This one is supposed to contain bz. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    layers:
    - state: bz
  - type: GasCanister
    gasMixture:
      volume: 1500
      moles:
      - 0 # oxygen
      - 0 # nitrogen
      - 0 # CO2
      - 0 # Plasma
      - 0 # Tritium
      - 0 # Water vapor
      - 0 # Ammonia
      - 0 # N2O
      - 0 # Frezon
      - 0 # Respiron
      - 0 # Helium
      - 2769.36 # BZ
      - 0 # Healium
      - 0 # Nitrium
      - 0 # Pluoxium
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          BZCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior

