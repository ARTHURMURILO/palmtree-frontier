# Ported from Goob Station (_Goobstation/Entities/Structures/Furniture/cdrack.yml).
# Palmtree: ported as decor that actually holds music records — vanilla Frontier JukeboxContainer
# records (albums and singles alike), 20 of them, with the sprite filling up as you add more.

- type: entity
  id: CdRack
  parent: BaseStructure
  name: CD rack
  description: Mostly filled with CDs.
  components:
  - type: Construction
    graph: CdRackGraph
    node: CdRackNode
  - type: Sprite
    sprite: _Goobstation/Structures/Furniture/cdrack.rsi
    snapCardinals: true
    layers:
      - state: base
      - map: ["enum.StorageFillLayers.Fill"]
        state: cd-0
  - type: Appearance
  - type: StorageFillVisualizer
    maxFillLevels: 11
    fillBaseName: cd
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,19 # 20 records, 2x2 each
    whitelist:
      components:
      - JukeboxContainer
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 2
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Structure
    - Wooden
  - type: Transform
    anchored: true
    noRot: true
  - type: Anchorable
  - type: InteractionOutline
