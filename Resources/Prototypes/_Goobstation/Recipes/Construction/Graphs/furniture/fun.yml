# Construction graphs for the Goob decor port, batch 2 (CD rack, torch, fires).

- type: constructionGraph
  id: CdRackGraph
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: CdRackNode
          completed:
            - !type:SnapToGrid {}
          steps:
            - material: WoodPlank
              amount: 3
              doAfter: 4
    - node: CdRackNode
      entity: CdRack
      edges:
        - to: start
          completed:
            - !type:GivePrototype
              prototype: MaterialWoodPlank1
              amount: 3
          steps:
            - tool: Prying
              doAfter: 2

