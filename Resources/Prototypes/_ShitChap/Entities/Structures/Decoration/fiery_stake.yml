# Ported from Goob Station (_Goobstation/Entities/Structures/Specific/fiery_stake.yml).
# Palmtree: IgniteOnBuckle is Goob-only, so it was dropped; the stake still ignites through IgnitionSource.

- type: entity
  id: FieryStake
  parent: BaseStructure
  name: fiery stake
  description: But God demonstrates his own love for us in this... While we were still sinners, Christ died for us!
  components:
  - type: Construction
    graph: FieryStakeGraph
    node: BonfireNode
  - type: Sprite
    noRot: true
    sprite: _ShitChap/Structures/bonfire.rsi
    offset: 0,0.5
    layers:
    - state: bonfire
    - state: burning
  - type: PointLight
    radius: 5
    energy: 3
    color: "#FFC90C"
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: AmbientSound
    volume: -5
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: Strap
    position: Stand
    buckleOffset: "0,0.25"
  - type: IgnitionSource
    temperature: 400
    ignited: true
  - type: AlwaysHot
