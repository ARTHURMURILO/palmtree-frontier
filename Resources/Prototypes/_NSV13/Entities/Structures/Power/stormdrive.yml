# NSV13 - Stormdrive fusion reactor.
#
# Ported from BeeStation/NSV13 `stormdrive.dm`. Unlike the RBMK this is a BINARY atmospherics
# machine: fuel goes in one port, nucleium waste comes out the other. Feeds power to the grid.
#
# ART: ported from NSV13's goonstation reactor.dmi (converted to RSI v2). All of the DM
# update_icon() states are present and animated - reactor_on/hot (9 frames each), reactor_overheat
# (6), meltdown (8), broken (7), plus the repair-1/reinforce-2/refit-3 recovery states and the
# twenty-four rods_{count}_{band} overlays (six rod counts by four insertion bands).
#
# ORIENTATION: the original's default has the fuel INPUT on the east side and the waste OUTPUT on
# the west, which is the reverse of what you might expect. Keep that in mind when piping it up.
#
# DANGER: control rod percent is NOT a throttle in the intuitive direction. 0% means the rods are
# fully withdrawn - maximum reactivity AND cooling disabled - which melts the core down.

- type: entity
  id: StormdriveReactor
  parent: [ BaseMachine, ConstructibleMachine ]
  name: class IV nuclear storm drive
  description: What you get when somebody decides to inject magnetically constricted plasma into a nuclear reactor. It produces an ungodly amount of superheated plasma, radiation and fire. God help you if it melts down.
  placement:
    mode: SnapgridCenter
  components:
  # No `noRot`: the fuel/waste ports turn with the hull, so the art has to turn with them.
  - type: Sprite
    sprite: _NSV13/Objects/Structures/Power/stormdrive.rsi
    # Same as the RBMK: a floor machine, so dragged crates and items draw in front of it.
    drawdepth: HighFloorObjects
    layers:
    - state: reactor_off
      map: ["core"]
    - state: rods_5_1
      map: ["rods"]
      visible: false
  # The drive is a 3x1 machine: with the stock 1x1 `fix1` a girder or wall could be built through
  # either end. The fixture stays soft so the drive is not a wall; `ConstructionBlocker` reserves
  # the 3x1 footprint for construction instead. Pipes and cables are unaffected - their recipes do
  # not run the tile check.
  - type: ConstructionBlocker
  - type: Fixtures
    fixtures:
      # The core itself is solid; the two end tiles are walk-over and only reserved against building.
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        hard: true
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
      footprint:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.5,-0.5,1.5,0.5"
        hard: false
  - type: GenericVisualizer
    visuals:
      enum.StormdriveVisuals.Core:
        core:
          Off: { state: reactor_off }
          Starting: { state: reactor_starting }
          Maintenance: { state: reactor_maintenance }
          On: { state: reactor_on }
          Hot: { state: reactor_hot }
          Overheat: { state: reactor_overheat }
          Meltdown: { state: meltdown }
          Broken: { state: broken }
          Repair: { state: repair-1 }
          Reinforce: { state: reinforce-2 }
          Refit: { state: refit-3 }
      enum.StormdriveVisuals.Rods:
        rods:
          none: { visible: false }
          "rods_0_1": { state: rods_0_1, visible: true }
          "rods_0_2": { state: rods_0_2, visible: true }
          "rods_0_3": { state: rods_0_3, visible: true }
          "rods_0_4": { state: rods_0_4, visible: true }
          "rods_1_1": { state: rods_1_1, visible: true }
          "rods_1_2": { state: rods_1_2, visible: true }
          "rods_1_3": { state: rods_1_3, visible: true }
          "rods_1_4": { state: rods_1_4, visible: true }
          "rods_2_1": { state: rods_2_1, visible: true }
          "rods_2_2": { state: rods_2_2, visible: true }
          "rods_2_3": { state: rods_2_3, visible: true }
          "rods_2_4": { state: rods_2_4, visible: true }
          "rods_3_1": { state: rods_3_1, visible: true }
          "rods_3_2": { state: rods_3_2, visible: true }
          "rods_3_3": { state: rods_3_3, visible: true }
          "rods_3_4": { state: rods_3_4, visible: true }
          "rods_4_1": { state: rods_4_1, visible: true }
          "rods_4_2": { state: rods_4_2, visible: true }
          "rods_4_3": { state: rods_4_3, visible: true }
          "rods_4_4": { state: rods_4_4, visible: true }
          "rods_5_1": { state: rods_5_1, visible: true }
          "rods_5_2": { state: rods_5_2, visible: true }
          "rods_5_3": { state: rods_5_3, visible: true }
          "rods_5_4": { state: rods_5_4, visible: true }
  # Looping core hum, raised by try_start() and silenced by deactivate() (stormdrive.dm:539).
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 6
    sound:
      path: /Audio/_NSV13/Reactor/hum.ogg
  - type: PointLight
    radius: 1.5
    energy: 2
    color: "#00ffff"
    enabled: false
  - type: Appearance
  - type: AtmosDevice
  - type: NodeContainer
    # Opt in to the standard "It has a connector for HV cables." examine line.
    examinable: true
    nodes:
      fuel:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: East
      waste:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: West
      # HV power take-off. Without a cable device node the PowerSupplier below is never attached
      # to a net, so the drive spun up, reported megawatts on its console, and exported none of it.
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  # Mirrors the pipe directions above so the client can draw them on examine. The art is symmetric
  # and the nodes themselves never leave the server, so without this the player has no way to tell
  # which face is the feed and which is the waste line once the machine has been rotated.
  - type: ReactorPortLayout
    fuel: East
    waste: West
  - type: Stormdrive

  # The machine has to survive its own failure. BaseMachine's Destructible thresholds delete the
  # entity outright once it has taken 200 damage, and a meltdown deals thousands - so the reactor
  # vanished in the blast instead of staying behind as a wreck, which is what the DM original leaves
  # (its `icon_state` goes to the slagged/broken state and the machine is still there to be examined,
  # repaired around, or scavenged). Emptying the thresholds keeps the machine damageable but
  # indestructible, so the wreck is where the wreck should be.
  - type: Destructible
    thresholds: []
  # See the same block on the RBMK: a zero ramp rate pins the delivered power at 0 W forever.
  - type: PowerSupplier
    supplyRate: 0
    supplyRampRate: 5000000
    supplyRampTolerance: 500000
  - type: PowerMonitoringDevice
    group: Generator
    loadNode: output
    sprite: Structures/Power/power.rsi
    state: generator
  # The console is linked to the drive with a multitool; the link lands on this sink port.
  - type: DeviceLinkSink
    ports:
      - ReactorControl
  # Shortband alarms do not cross a map without a telecomms relay; the drive carries its own pass.
  - type: TelecomExempt
  # Bolted down for life: still fittable on a fresh spawn, never removable afterwards.
  - type: Anchorable
    flags: Anchorable
  - type: Machine
    board: StormdriveReactorMachineCircuitboard
  # Reactors cannot be deconstructed (and cannot be constructed yet). The stock `Machine` graph
  # lets a bare crowbar pry the whole machine back into a frame; `ReactorMachine` is a terminal
  # node with no edges, so neither the crowbar nor the deconstruct verb can path anywhere. A
  # proper construction path will be added later.
  - type: Construction
    graph: ReactorMachine
    # The graph has a single `machine` node and no edges; pointing the deconstruction target at
    # that same node means the deconstruct verb sees "already there" and offers nothing.
    deconstructionTarget: machine
  # The rod bay: the DM reactor's own TGUI, where you pull and mount control rods by hand. Declaring
  # the container up front means it is part of the entity from spawn instead of being added when the
  # first rod is inserted.
  - type: ContainerContainer
    containers:
      stormdrive_rods: !type:Container
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: ActivatableUI
    key: enum.StormdriveRodsUiKey.Key
  - type: UserInterface
    interfaces:
      enum.StormdriveRodsUiKey.Key:
        type: StormdriveRodsBoundUserInterface
  - type: RadiationSource
    intensity: 0
    slope: 0.5
  - type: StaticPrice
    price: 12000

# Mapping convenience: a drive that is already running and warm.
- type: entity
  id: StormdriveReactorRunning
  parent: StormdriveReactor
  suffix: Running
  components:
  # Five standard rods pre-loaded in the bay, so the drive has something to moderate with. The
  # integrity figure is derived from these on map init, not hand-set.
  - type: ContainerFill
    containers:
      stormdrive_rods:
      - ControlRod
      - ControlRod
      - ControlRod
      - ControlRod
      - ControlRod
  - type: Stormdrive
    state: Running
    heat: 200
    reactionRate: 5
    controlRodPercent: 33.6
