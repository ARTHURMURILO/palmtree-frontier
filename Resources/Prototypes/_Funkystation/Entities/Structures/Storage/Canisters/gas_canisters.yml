# Funky atmos - /tg/ gases
# Canisters for the gases appended in Content.Shared/Atmos/Atmospherics.cs (ids 11-20).
# The 1500 L volume and the moles keep the same fill pressure as the codebase's
# other canisters; Funky fills theirs at 1000 L.

- type: entity
  parent: GasCanister
  id: BZCanister
  name: bz canister
  components:
  - type: Sprite
    sprite: _Funkystation/Structures/Storage/canister.rsi
    layers:
    - state: purple
  - type: GasCanister
    gasMixture:
      volume: 1500
      moles:
      - 0 # oxygen
      - 0 # nitrogen
      - 0 # carbon dioxide
      - 0 # plasma
      - 0 # tritium
      - 0 # water vapor
      - 0 # ammonia
      - 0 # nitrous oxide
      - 0 # frezon
      - 0 # respiron
      - 0 # helium
      - 0 # nucleium (NSV13, reserved)
      - 2807.565765 # bz
      - 0 # healium
      - 0 # nitrium
      - 0 # pluoxium
      - 0 # hydrogen
      - 0 # hyper-noblium
      - 0 # proto-nitrate
      - 0 # zauker
      - 0 # halon
      - 0 # anti-noblium
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          BZCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior

