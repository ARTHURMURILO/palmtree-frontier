- type: entity
  id: ElectrolyzerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: electrolyzer machine board
  description: A machine printed circuit board for an electrolyzer.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: Electrolyzer
    requirements:
      Capacitor: 4
    stackRequirements:
      Steel: 5
      CableHV: 5
      Plasteel: 2

- type: entity
  id: CrystallizerMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: crystallizer machine board
  description: A machine printed circuit board for a crystallizer.
  components:
  - type: MachineBoard
    prototype: Crystallizer
    requirements:
      Capacitor: 2
      Manipulator: 4
      MatterBin: 4
    stackRequirements:
      Steel: 5
      Glass: 5

- type: entity
  id: PipeScrubberMachineCircuitBoard
  parent: BaseMachineCircuitboard
  name: pipe scrubber machine board
  description: A machine printed circuit board for a pipe scrubber.
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: PipeScrubber
    requirements:
      MatterBin: 1
      Manipulator: 2
    stackRequirements:
      Cable: 5
      Glass: 2
