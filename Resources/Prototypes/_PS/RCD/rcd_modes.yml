# Palmtree: extended RCD modes.
#
# This file holds the extra walls/windows, light variants and ship-construction suite added to the
# normal and experimental RCDs. Existing upstream modes stay in their original files; only their
# categories are adjusted there.

# Windows and grilles -------------------------------------------------------

- type: rcd
  id: GrilleDiagonal
  category: WindowsAndGrilles
  sprite: { sprite: Structures/Walls/grille.rsi, state: grille_diagonal }
  mode: ConstructObject
  prototype: GrilleDiagonal
  cost: 4
  delay: 2
  collisionMask: Impassable
  rotation: User
  collisionBounds: "-0.23,-0.49,0.23,-0.36"
