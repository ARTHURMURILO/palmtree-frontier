# Palmtree: tesla coils are required to build the supermatter and tesla engines.
# Sell the flatpacks directly so crews are not dependent on the Edison POI bulk
# crates for every component. Radiation collectors are not part of the supermatter
# power path and are not sold here.

- type: cargoProduct
  id: EngineTeslaCoilFlatpack
  icon:
    sprite: Structures/Power/Generation/Tesla/coil.rsi
    state: coil
  product: TeslaCoilFlatpack
  cost: 12500
  category: cargoproduct-category-name-engineering
  group: market

# Palmtree: the supermatter monitoring console board had no source at all. Crews that lost or
# never had the console could not rebuild it, so sell the board directly as well as unlocking it
# in Atmospheric Damage Control.
- type: cargoProduct
  id: EngineSupermatterConsoleBoard
  icon:
    sprite: Objects/Misc/module.rsi
    state: cpu_engineering
  product: SupermatterComputerCircuitboard
  cost: 4000
  category: cargoproduct-category-name-engineering
  group: market
