- type: modsuitTheme
  id: ModsuitThemeStandard
  name: standard
  description: A general-purpose MODsuit theme.
  defaultSkin: standard
  complexityMax: 15
  chargeDrain: 0.05
  armor: ModsuitArmorStandard
  inbuiltModules:
  - ModsuitModuleStorage
  skins:
    standard:
      parts:
        helmet:
          sprite: /Textures/_PS/Modsuits/Clothing/mod_clothing.rsi
          state: standard-helmet
          sealedState: standard-helmet-sealed
        chestplate:
          sprite: /Textures/_PS/Modsuits/Clothing/mod_clothing.rsi
          state: standard-chestplate
          sealedState: standard-chestplate-sealed
        gauntlets:
          sprite: /Textures/_PS/Modsuits/Clothing/mod_clothing.rsi
          state: standard-gauntlets
          sealedState: standard-gauntlets-sealed
        boots:
          sprite: /Textures/_PS/Modsuits/Clothing/mod_clothing.rsi
          state: standard-boots
          sealedState: standard-boots-sealed

