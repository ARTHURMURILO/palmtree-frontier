- type: entity
  id: ModsuitHelmet
  name: MOD helmet
  parent: Clothing
  save: false
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Clothing/Head/Hardsuits/engineering.rsi
    state: icon
  - type: Clothing
    slots: [ HEAD ]
    sprite: _PS/Modsuits/Clothing/mod_clothing.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.9
        Radiation: 0.8
        Caustic: 0.9
  - type: Item
    size: Normal
  - type: ModsuitPart
    slot: Helmet
    hiddenWhenSealed:
    - Hair
    - FacialHair
    - Snout
    - HeadTop
    - HeadSide
  - type: AttachedClothing

