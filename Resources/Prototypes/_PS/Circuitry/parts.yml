    state: service
  - type: CircuitPart
    partType: Analyzer
    analyzerType: Botanical
    idlePowerDraw: 0.05
    actionPowerCost: 0.05
  - type: Tag
    tags: [ CircuitAnalyzer ]

- type: entity
