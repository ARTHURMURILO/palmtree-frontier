# Palmtree: the roomba does not plan routes. RoombaSystem drives it like a real robot vacuum
# (constant motion, bump-and-turn, never off the grid) and scrubs what it drives over. This
# compound only keeps the NPC awake so the steering system runs; it never moves or cleans.
- type: htnCompound
  id: RoombaIdleCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:RandomOperator
            targetKey: IdleTime
            minKey: MinimumIdleTime
            maxKey: MaximumIdleTime
        - !type:HTNPrimitiveTask
          operator: !type:WaitOperator
            key: IdleTime
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
