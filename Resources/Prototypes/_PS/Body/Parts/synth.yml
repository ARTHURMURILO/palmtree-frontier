# Silicon body parts for the Synth species. Legs carry the doubled movement speed.
- type: entity
  id: PartSynth
  parent: [BaseItem, BasePart]
  name: "synth body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Inorganic
  - type: Sprite
    sprite: _EE/Mobs/Species/IPC/parts.rsi
  # Palmtree: return materials like the cyborg/silicon parts do (Steel 25).
  - type: PhysicalComposition
    materialComposition:
      Steel: 25

- type: entity
  id: TorsoSynth
  name: "synth torso"
  parent: [PartSynth, BaseTorso]
  components:
  - type: Sprite
    state: "torso_m"
  - type: ContainerContainer
    containers:
      torso_slot: !type:ContainerSlot {}

- type: entity
  id: HeadSynth
  name: "synth head"
  parent: [PartSynth, BaseHead]
  components:
  - type: Sprite
    state: "head_m"

- type: entity
  id: LeftArmSynth
  name: "left synth arm"
  parent: [PartSynth, BaseLeftArm]
  components:
  - type: Sprite
    state: "l_arm"

- type: entity
  id: RightArmSynth
  name: "right synth arm"
  parent: [PartSynth, BaseRightArm]
  components:
  - type: Sprite
    state: "r_arm"

- type: entity
  id: LeftHandSynth
  name: "left synth hand"
  parent: [PartSynth, BaseLeftHand]
  components:
  - type: Sprite
    state: "l_hand"

- type: entity
  id: RightHandSynth
  name: "right synth hand"
  parent: [PartSynth, BaseRightHand]
  components:
  - type: Sprite
    state: "r_hand"

- type: entity
  id: LeftLegSynth
  name: "left synth leg"
  parent: [PartSynth, BaseLeftLeg]
  components:
  - type: Sprite
    state: "l_leg"
  - type: MovementBodyPart
    walkSpeed: 3.75
    sprintSpeed: 6.75

- type: entity
  id: RightLegSynth
  name: "right synth leg"
  parent: [PartSynth, BaseRightLeg]
  components:
  - type: Sprite
    state: "r_leg"
  - type: MovementBodyPart
    walkSpeed: 3.75
    sprintSpeed: 6.75

- type: entity
  id: LeftFootSynth
  name: "left synth foot"
  parent: [PartSynth, BaseLeftFoot]
  components:
  - type: Sprite
    state: "l_foot"

- type: entity
  id: RightFootSynth
  name: "right synth foot"
  parent: [PartSynth, BaseRightFoot]
  components:
  - type: Sprite
    state: "r_foot"
