- type: entity
  parent: BaseBullet
  id: ShipTurretBolt
  name: turret bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    # The beam states in projectiles.rsi are horizontal; projectile sprites are rotated to their
    # velocity, so a vertical bolt sprite is needed (placeholder: the emitter bolt, tinted red).
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    color: "#ff6b6b"
    layers:
    - state: projectile
      shader: unshaded
  - type: Ammo
    muzzleFlash: null
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Heat: 20
  - type: TimedDespawn
    lifetime: 6

- type: entity
  parent: BaseBullet
  id: ShipStationaryBolt
  name: ship weapon bolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    layers:
    - state: projectile
      shader: unshaded
  - type: Ammo
    muzzleFlash: null
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    damage:
      types:
        Heat: 25
  - type: TimedDespawn
    lifetime: 6

# Bright flash spawned where a ship beam lands; the server gives it a global PVS override so the
# ship being shot at sees it even from far outside PVS.
- type: entity
  id: ShipBeamImpact
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles.rsi
    layers:
    - state: impact_beam_heavy
      shader: unshaded
  - type: PointLight
    radius: 3
    energy: 4
    color: "#ff5555"
    castShadows: false
  - type: TimedDespawn
    lifetime: 0.3

# Beam turret hitscan: a long-range laser beam (ship combat range matches the console radar).
- type: hitscan
  id: ShipTurretBeam
  damage:
    types:
      Heat: 20
  # No vanilla muzzle/travel/impact flashes: they are grid-parented (they follow the firing ship) and
  # only sent to players whose PVS covers the shot. ShipWeaponSystem spawns a map-anchored impact
  # flash with a global PVS override instead.
  # Plays at the hit entity, so the ship being shot hears the beam land (even through its shields).
  sound:
    path: /Audio/Weapons/Guns/Hits/energy_metal1.ogg
  forceSound: true
  maxLength: 512

- type: entity
  parent: BaseStructureDynamic
  id: ShipTurretBase
  abstract: true
  name: ship turret
  description: A console-driven turret with a 45-degree firing arc. Powered by the bluespace power bypass.
  suffix: Palmtree
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Turrets/laser.rsi # Placeholder until ship turrets get their own art.
    layers:
    - state: base
  - type: ShipWeapon
    weaponType: Turret
    arcHalfAngle: 22.5
  - type: BluespacePowered
    pool: Weapons
    ratedPower: 5000
  - type: ApcPowerReceiver
    needsPower: false
    powerDisabled: true
    powerLoad: 0
  - type: GunDamageMultiplier
  - type: DeviceLinkSink
    ports:
    - ShipWeaponPrimary
    - ShipWeaponSecondary
    - ShipWeaponAux
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 1500

# Bolt variant: fires a travelling projectile.
- type: entity
  parent: ShipTurretBase
  id: ShipTurret
  name: ship turret (bolt)
  description: A console-driven turret firing travelling energy bolts. 45-degree arc, powered by the bluespace power bypass.
  components:
  - type: Gun
    fireRate: 1
    projectileSpeed: 60
    selectedMode: SemiAuto
    minAngle: 0
    maxAngle: 0
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
  - type: BasicEntityAmmoProvider
    proto: ShipTurretBolt
    capacity: 2
    count: 2

# Beam variant: fires an instant hitscan laser, slower but always on target.
- type: entity
  parent: ShipTurretBase
  id: ShipTurretBeam
  name: ship turret (beam)
  description: A console-driven turret firing an instant laser beam. 45-degree arc, powered by the bluespace power bypass.
  components:
  - type: Gun
    fireRate: 0.5
    selectedMode: SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 100000
  - type: HitscanBatteryAmmoProvider
    proto: ShipTurretBeam
    fireCost: 1

- type: entity
