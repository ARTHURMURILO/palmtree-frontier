- type: entity
  parent: BaseComputer
  id: ComputerTacticalConsole
  name: tactical console
  description: A military-grade targeting console. Renders the ship IFF with tactical overlays and controls the ship's weapons.
  suffix: Palmtree
  components:
  - type: ShipTargetingConsole
  - type: DeviceLinkSource
    ports:
    - ShipWeaponLink
  - type: ActivatableUI
    key: enum.TacticalConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TacticalConsoleUiKey.Key:
        type: TacticalConsoleBoundUserInterface
  - type: RadarConsole
    maxRange: 512
  - type: WorldLoader
    radius: 512
  - type: Sprite
    sprite: _PS/Structures/Machines/tactical_console.rsi
    layers:
    - map: ["computerLayerBody"]
      state: computer_blackmarket
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_blackmarket
    - map: ["computerLayerKeys"]
      state: blackmarket_key

- type: entity
  parent: [BaseStructureComputerTabletop, ComputerTacticalConsole]
  id: ComputerTabletopTacticalConsole
  name: tabletop tactical console
  description: A compact tactical console for ship weapon control.
  suffix: Palmtree, Tabletop
  components:
  - type: Sprite
    drawdepth: SmallObjects
    layers:
    - map: ["computerLayerBody"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: computer_tabletop
    - map: ["computerLayerKeyboard"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: generic_keyboard_tabletop
    - map: ["computerLayerScreen"]
      sprite: _PS/Structures/Machines/tactical_console.rsi
      state: shipyard_blackmarket
    - map: ["computerLayerKeys"]
      sprite: _PS/Structures/Machines/tactical_console.rsi
      state: blackmarket_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      sprite: Structures/Machines/computers.rsi
      state: generic_panel_open

- type: entity
  parent: BaseComputer
  id: ComputerShieldingConsole
  name: engineering console
  description: Controls the ship's power distribution and directional shields.
  suffix: Palmtree
  components:
  - type: ShipShieldingConsole
  - type: ActivatableUI
    key: enum.ShieldingConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.ShieldingConsoleUiKey.Key:
        type: ShieldingConsoleBoundUserInterface
  - type: RadarConsole
    maxRange: 512
  - type: WorldLoader
    radius: 512
  - type: Sprite
    sprite: _PS/Structures/Machines/tactical_console.rsi
    color: "#d8c86a" # Placeholder dark yellow tint until the console gets its own art.
    layers:
    - map: ["computerLayerBody"]
      state: computer_blackmarket
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: shipyard_blackmarket
    - map: ["computerLayerKeys"]
      state: blackmarket_key

- type: entity
  parent: [BaseStructureComputerTabletop, ComputerShieldingConsole]
  id: ComputerTabletopShieldingConsole
  name: tabletop engineering console
  description: A compact engineering console for ship power distribution and directional shields.
  suffix: Palmtree, Tabletop
  components:
  - type: Sprite
    drawdepth: SmallObjects
    color: "#d8c86a" # Match the full engineering console's placeholder tint.
    layers:
    - map: ["computerLayerBody"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: computer_tabletop
    - map: ["computerLayerKeyboard"]
      sprite: _NF/Structures/Machines/computer_tabletop.rsi
      state: generic_keyboard_tabletop
    - map: ["computerLayerScreen"]
      sprite: _PS/Structures/Machines/tactical_console.rsi
      state: shipyard_blackmarket
    - map: ["computerLayerKeys"]
      sprite: _PS/Structures/Machines/tactical_console.rsi
      state: blackmarket_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      sprite: Structures/Machines/computers.rsi
      state: generic_panel_open
