# Palmtree: ship torpedoes and their launchers.

- type: entity
  parent: BaseBullet
  id: ShipTorpedo
  name: torpedo
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi # Placeholder until torpedoes get their own art.
    layers:
    - state: projectile
      shader: unshaded
  - type: Ammo
    muzzleFlash: null
  # Palmtree: torpedoes must keep moving in space. The physics damping stays at zero and the tile
  # friction modifier stops the space friction controller from grinding them to a halt.
  - type: Physics
    bodyType: Dynamic
    linearDamping: 0
    angularDamping: 0
  - type: TileFrictionModifier
    modifier: 0
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Projectile
    deleteOnCollide: false
    damage:
      types:
        Heat: 150
  # Explodes violently on impact (a syndicate-bomb scale blast); shields still absorb it first.
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 500
    intensitySlope: 8
    maxIntensity: 50
    canCreateVacuum: false
  - type: ShipTorpedo
  - type: TimedDespawn
    lifetime: 60
  - type: PointLight
    radius: 1.5
    energy: 2
    color: "#66ccff"
    castShadows: false

- type: entity
  parent: ShipTorpedo
  id: ShipTorpedoPhoton
  name: photon torpedo
  categories: [ HideSpawnMenu ]
  components:
  - type: ShipTorpedo
    speed: 40
    turnRate: 45
    shieldDamage: 280
    steeringDelay: 2
    steeringRamp: 3.5
    maxSteeringAngle: 120
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    color: "#ff5555"
    layers:
    - state: projectile
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 300
  - type: Explosive
    explosionType: Default
    totalIntensity: 900
    intensitySlope: 9
    maxIntensity: 60
    canCreateVacuum: false
  - type: PointLight
    radius: 2.5
    energy: 3
    color: "#ff3333"
    castShadows: false

- type: entity
  parent: BaseStructureDynamic
  id: ShipTorpedoLauncher
  name: torpedo launcher
  description: Fires homing torpedoes at the tactical console's locked target. Needs a set lock and exposed space in front, and never fires automatically.
  suffix: Palmtree
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Rotatable
    rotateWhileAnchored: true
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi # Placeholder until launchers get their own art.
    layers:
    - state: emitter0
  - type: ShipTorpedoLauncher
  - type: BluespacePowered
    pool: Weapons
    ratedPower: 0 # Launchers consume per torpedo, not passively.
  - type: ApcPowerReceiver
    needsPower: false
    powerDisabled: true
    powerLoad: 0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 2000

- type: entity
  parent: ShipTorpedoLauncher
  id: ShipTorpedoLauncherPhoton
  name: photon torpedo launcher
  description: "Fires upgraded photon torpedoes: faster, harder hitting and with delayed steering that ramps up to full turn rate."
  components:
  - type: ShipTorpedoLauncher
    torpedo: ShipTorpedoPhoton
    fireCooldown: 9

# Uranium torpedo: photon speed, much less steering, radiation damage and a green glow.
- type: entity
  parent: ShipTorpedo
  id: ShipTorpedoUranium
  name: uranium torpedo
  categories: [ HideSpawnMenu ]
  components:
  - type: ShipTorpedo
    speed: 40
    turnRate: 15
    shieldDamage: 250
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/emitter.rsi
    color: "#55ff55"
    layers:
    - state: projectile
      shader: unshaded
  - type: Projectile
    damage:
      types:
        Heat: 200
        Radiation: 50
  - type: Explosive
    explosionType: Default
    totalIntensity: 700
    intensitySlope: 9
    maxIntensity: 55
    canCreateVacuum: false
  - type: PointLight
    radius: 2.5
    energy: 3
    color: "#55ff55"
    castShadows: false

- type: entity
  parent: ShipTorpedoLauncher
  id: ShipTorpedoLauncherUranium
  name: uranium torpedo launcher
  description: "Fires uranium torpedoes: photon speed with much less steering, a green glow and a Romulan launch howl."
  components:
  - type: ShipTorpedoLauncher
    torpedo: ShipTorpedoUranium
    fireCooldown: 9
    launchSound:
      path: /Audio/_PS/ShipCombat/romulan_torpedo.ogg
