- type: entity
  parent: BaseMachine
  id: BluespacePowerSink
  name: bluespace power sink
  description: Splits a ship's generator output between its shields, weapons and thrusters, and feeds whatever is left back into the power grid.
  suffix: Palmtree
  components:
  - type: Sprite
    sprite: Structures/Power/smes.rsi # Placeholder until the sink gets its own art.
    snapCardinals: true
    layers:
    - state: smes
    - state: smes-oc0 # Input indicator, like the SMES.
      shader: unshaded
    - state: smes-op1 # Output indicator, like the SMES.
      shader: unshaded
  - type: PointLight
    radius: 1.5
    energy: 2.5
    color: "#8f6fd8"
    castShadows: false
  - type: Battery
    maxCharge: 2000000
    startingCharge: 2000000
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableTerminalPortNode
        nodeGroupID: HVPower
      output:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: BatteryCharger
    voltage: High
    node: input
  # Palmtree: the output side is a PowerSupplier, not a BatteryDischarger: the sink supplies the
  # ship's grid (drained from its battery by ShipPowerSystem). A battery endpoint on both sides can
  # form charger/discharger loops with other batteries, which crashes the power solver.
  - type: PowerSupplier
    node: output
    supplyRate: 0
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: PowerNetworkBattery
    maxChargeRate: 100000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: BluespacePowerSink
    ratedThroughput: 100000
  - type: StaticPrice
    price: 1500

- type: entity
  parent: BaseThruster
  id: BluespaceThruster
  name: bluespace thruster
  description: A thruster fed by the ship's bluespace power sink instead of cables. More power means more speed.
  suffix: Palmtree
  components:
  - type: Sprite
    sprite: _NF/Structures/Shuttles/thruster.rsi # Placeholder until the bluespace thruster gets its own art.
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      offset: 0, 1
  - type: ApcPowerReceiver
    needsPower: false
    powerDisabled: true
    powerLoad: 0
  - type: BluespacePowered
    pool: Thrusters
    ratedPower: 10000
  - type: BluespaceThruster

- type: entity
  parent: BaseMachine
  id: ShieldGenerator
  name: shield generator
  description: Projects the ship's directional shields, fed by the bluespace power sink.
  suffix: Palmtree
  components:
  - type: Sprite
    sprite: Structures/Machines/gravity_generator_mini.rsi # Placeholder until the shield generator gets its own art.
    state: on
    snapCardinals: true
  - type: PointLight
    radius: 1.5
    energy: 3
    color: "#4db8ff"
    castShadows: false
  - type: ShieldGenerator
    maxPerFacing: 300
    regenPerPulse: 30
  - type: ApcPowerReceiver
    needsPower: false
    powerDisabled: true
    powerLoad: 0
  - type: BluespacePowered
    pool: Shields
    ratedPower: 15000
  - type: StaticPrice
    price: 2500
