# Palmtree: the roomba — a craftable cleanbot variant that drives around like a real robot vacuum
# (constant motion, bumping into walls and turning) and scrubs cleanable floor decals (grime, crayon,
# semen drips and ejaculate) as it passes over them. Its brain is Content.Server/_PS/Roomba.
- type: entity
  parent: MobCleanBot
  id: MobRoomba
  name: roomba
  description: A disc-shaped vacuum bot. The creep of automation, now upgraded to hunt down every stain and loose piece of trash on the floor.
  components:
  - type: Sprite
    sprite: _PS/Mobs/Silicon/Bots/roomba.rsi
    # SmallMobs so the roomba renders underneath tables it rolls under (like mice), instead of the
    # BaseMob default of Mobs, which draws over furniture.
    drawdepth: SmallMobs
    layers:
    - state: roomba
      map: ["enum.RoombaVisualLayers.Base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      # Dim the robot while it is switched off (click it to toggle power).
      enum.RoombaVisuals.Enabled:
        enum.RoombaVisualLayers.Base:
          True: { color: "#FFFFFF" }
          False: { color: "#6E6E6E" }
  - type: Construction
    graph: Roomba
    node: bot
  # RoombaSystem drives and cleans; the HTN task only keeps the NPC awake.
  - type: Roomba
    enabled: false
  - type: HTN
    rootTask:
      task: RoombaIdleCompound
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.6
    baseSprintSpeed: 1.8
  # Short delay so mopping puddles while driving does not lag behind.
  - type: UseDelay
    delay: 0.5
  # Internal trash bag. ContainerFill spawns the bag on MapInit; the right-click "take full trash bag"
  # verb swaps it for a fresh one (RoombaSystem), so there is no way to insert items manually.
  - type: ContainerContainer
    containers:
      roomba_trash_bag: !type:Container
        ents: []
  - type: ContainerFill
    containers:
      roomba_trash_bag:
      - TrashBag
  # Small enough to roll under tables and chairs like a mouse, and it never shoves mobs around
  # (SharedRoombaSystem cancels the mob-collision target side for it).
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
            radius: 0.25
        density: 50
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: InteractionPopup
    # Clicking toggles power (RoombaSystem handles InteractHandEvent); there is no petting popup.
    interactSuccessString: null
    interactFailureString: null
    interactSuccessSound: null
