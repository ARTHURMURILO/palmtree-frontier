# Palmtree: admin-only meme mobs. All of them are visible in the (admin-only) spawn menu,
# carry `suffix: Admeme`, and are not referenced by spawners, loot tables or vendors.
# Prototype-only; no C# systems are added here.

# A space carp that "attacks" with a healing beam. It is very aggressive about it.
- type: entity
  parent: MobCarp
  id: MobCarpMedic
  name: medicarp
  suffix: Admeme
  description: A space carp with a medical degree and a very aggressive bedside manner.
  components:
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: Gun
      showExamineText: false
      fireRate: 0.8
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/_PS/Weapons/healer.ogg
    - type: HitscanBatteryAmmoProvider
      proto: HealBeam
      fireCost: 50
    - type: Battery
      maxCharge: 1000
      startingCharge: 1000
    - type: BatterySelfRecharger
      autoRecharge: true
      autoRechargeRate: 100
    # It is here to help, not to bite.
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 0
          Slash: 0

# A roomba with a bomb. It cleans up the mess, then makes one.
- type: entity
  parent: MobRoomba
  id: MobRoombaDoomba
  name: doomba
  suffix: Admeme
  description: A roomba with a bomb strapped to it. It cleans up the mess, then makes one.
  components:
    - type: Explosive
      explosionType: Default
      totalIntensity: 100
      intensitySlope: 5
      maxIntensity: 15
      canCreateVacuum: false
    - type: ExplodeOnTrigger
    - type: TriggerOnProximity
      triggerSpeed: 0
      shape:
        !type:PhysShapeCircle
          radius: 1.5
      repeating: false
      requiresAnchored: false
      whitelist:
        components:
          - Actor
    - type: DeleteOnTrigger

# The right to bear arms, exercised.
- type: entity
  parent: MobBearSpace
  id: MobBearArms
  name: bear arms
  suffix: Admeme
  description: A space bear exercising its right to bear arms.
  components:
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: CombatMode
    - type: Gun
      showExamineText: false
      fireRate: 1
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/shotgun.ogg
    - type: BallisticAmmoProvider
      proto: NFShellShotgunBuckshot
      capacity: 50

# The honkbot had enough.
- type: entity
  parent: MobHonkBot
  id: MobHonkglock
  name: Honkglock
  suffix: Admeme
  description: The honkbot had enough
  components:
    - type: NpcFactionMember
      factions:
        - SimpleHostile
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: CombatMode
    - type: Gun
      showExamineText: false
      fireRate: 2
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      minAngle: 2
      maxAngle: 10
      angleIncrease: 3
      angleDecay: 5
      soundGunshot: /Audio/Weapons/Guns/Gunshots/pistol.ogg
    - type: BallisticAmmoProvider
      proto: NFCartridgeRifle25
      capacity: 500

# A carp that has decided it is campus security.
- type: entity
  parent: MobCarp
  id: MobCarpSecuritarp
  name: securitarp
  suffix: Admeme
  description: A space carp that has decided it is campus security. It will tase you, then forget why.
  components:
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: Gun
      showExamineText: false
      fireRate: 1.5
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/taser.ogg
    - type: BasicEntityAmmoProvider
      proto: BulletDisablerSmg
      capacity: 2
      count: 2
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 2
      rechargeSound: null
    # It is here to arrest you, not to eat you.
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 0
          Slash: 0

