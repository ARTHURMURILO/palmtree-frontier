# A carp you only see when it moves.
- type: entity
  parent: MobCarp
  id: MobCarpPhantom
  name: phantom carp
  suffix: Admeme
  description: A space carp that phases out of sight. You only notice it when it is already too late.
  components:
    - type: Stealth
      enabledOnDeath: false
      maxVisibility: 1.2
    - type: StealthOnMove
      passiveVisibilityRate: -0.25
      movementVisibilityRate: 0.25
    - type: MovementSpeedModifier
      baseWalkSpeed: 3
      baseSprintSpeed: 5
    - type: MeleeWeapon
      damage:
        types:
          Slash: 10

