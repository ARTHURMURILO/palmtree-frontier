# A disco ball with fins.
- type: entity
  parent: MobCarpRainbow
  id: MobCarpParty
  name: party carp
  suffix: Admeme
  description: A space carp with a disco ball, a laser light show, and absolutely no sense of self-preservation.
  components:
    - type: AmbientSound
      range: 8
      volume: -10
      sound:
        path: /Audio/Lobby/thunderdome.ogg
    - type: HTN
      rootTask:
        task: SimpleRangedHostileCompound
      blackboard:
        NavSmash: !type:Bool
          true
    - type: Gun
      showExamineText: false
      fireRate: 1
      useKey: false
      selectedMode: SemiAuto
      availableModes:
        - SemiAuto
      soundGunshot: /Audio/Weapons/Guns/Gunshots/laser_clown.ogg
      projectileSpeed: 20
    - type: BasicEntityAmmoProvider
      proto: PSPartyLaserSpread
      capacity: 1
      count: 1
    - type: RechargeBasicEntityAmmo
      rechargeCooldown: 1.5
      rechargeSound: null
    # The lasers are for the light show, not for damage.
    - type: MeleeWeapon
      damage:
        types:
          Blunt: 0
          Slash: 0
