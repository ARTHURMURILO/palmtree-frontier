# region Atmos meter

- type: entity
  parent: GasBinaryBase
  id: GasMeter
  name: atmos meter
  description: A pressure and temperature gauge for the pipeline it is attached to.
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
    - enum.GasMeterVisualLayers.Dial
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/atmos_meter.rsi
    drawdepth: FloorObjects
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: meter
      map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
    - state: pressure0
      map: [ "enum.GasMeterVisualLayers.Dial" ]
  - type: AtmosPipeLayers
    spriteRsiPaths:
      Primary: _PS/Structures/Piping/Atmospherics/atmos_meter.rsi
      Secondary: _PS/Structures/Piping/Atmospherics/atmos_meter_alt1.rsi
      Tertiary: _PS/Structures/Piping/Atmospherics/atmos_meter_alt2.rsi
    alternativePrototypes:
      Primary: GasMeter
      Secondary: GasMeterAlt1
      Tertiary: GasMeterAlt2
  - type: NodeContainer
    nodes:
      monitored:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.GasMeterVisuals.Pressure:
        enum.GasMeterVisualLayers.Dial:
          Zero: { state: pressure0 }
          Low: { state: pressure1 }
          Medium: { state: pressure2 }
          High: { state: pressure3 }
          Extreme: { state: pressure4 }
      # Only the gauge bar is tinted, so the casing keeps its own colours.
      enum.GasMeterVisuals.Temperature:
        enum.GasMeterVisualLayers.Dial:
          Freezing: { color: "#4A86FF" }
          Cold: { color: "#66D9FF" }
          Normal: { color: "#9BE86B" }
          Warm: { color: "#FFD24A" }
          Hot: { color: "#FF8A3D" }
          Burning: { color: "#FF4D4D" }
  - type: PipeColorVisuals
  - type: GasMeter
  - type: Construction
    graph: GasTemperature
    node: meter
  - type: AtmosMonitoringConsoleDevice
  - type: GuideHelp
    guides:
    - TemperatureDevices

- type: entity
  parent: [ GasPipeLayerAlt1, GasMeter ]
  id: GasMeterAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/atmos_meter_alt1.rsi
    drawdepth: FloorObjects
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: meter
      map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
    - state: pressure0
      map: [ "enum.GasMeterVisualLayers.Dial" ]
  - type: Construction
    node: meterAlt1

- type: entity
  parent: [ GasPipeLayerAlt2, GasMeter ]
  id: GasMeterAlt2
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/atmos_meter_alt2.rsi
    drawdepth: FloorObjects
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt2.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: meter
      map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]
    - state: pressure0
      map: [ "enum.GasMeterVisualLayers.Dial" ]
  - type: Construction
    node: meterAlt2

# endregion
