# Palmtree: atmospherics devices ported from /tg/station.
#
# Each device ships as three prototypes, one per pipe layer, exactly like the vanilla pumps: the
# RPD picks the right one when it places the device (see AtmosPipeLayers.alternativePrototypes) and
# a multitool layer change swaps the sprite at runtime.

# region Temperature gate

- type: entity
  parent: GasBinaryBase
  id: GasTemperatureGate
  name: temperature gate
  description: A gate that only lets gas through while the gas on its inlet side is colder than the set temperature.
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/temperature_gate.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: tgate
      map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: AtmosPipeLayers
    spriteRsiPaths:
      Primary: _PS/Structures/Piping/Atmospherics/temperature_gate.rsi
      Secondary: _PS/Structures/Piping/Atmospherics/temperature_gate_alt1.rsi
      Tertiary: _PS/Structures/Piping/Atmospherics/temperature_gate_alt2.rsi
    alternativePrototypes:
      Primary: GasTemperatureGate
      Secondary: GasTemperatureGateAlt1
      Tertiary: GasTemperatureGateAlt2
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.TemperatureGateVisuals.State:
        enum.SubfloorLayers.FirstLayer:
          Off: { state: tgate }
          On: { state: tgateOn }
          Flowing: { state: tgateFlow }
  - type: PipeColorVisuals
  - type: GasTemperatureGate
  - type: ActivatableUI
    key: enum.GasTemperatureGateUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.GasTemperatureGateUiKey.Key:
        type: GasTemperatureGateBoundUserInterface
  - type: Construction
    graph: GasTemperature
    node: temperaturegate
  - type: AmbientSound
    enabled: false
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_hiss.ogg
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: GasValve
  - type: GuideHelp
    guides:
    - TemperatureDevices

- type: entity
  parent: [ GasPipeLayerAlt1, GasTemperatureGate ]
  id: GasTemperatureGateAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/temperature_gate_alt1.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: tgate
      map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: Construction
    node: temperaturegateAlt1

- type: entity
  parent: [ GasPipeLayerAlt2, GasTemperatureGate ]
  id: GasTemperatureGateAlt2
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/temperature_gate_alt2.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt2.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: tgate
      map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: Construction
    node: temperaturegateAlt2

# endregion

# region Temperature pump

- type: entity
  parent: GasBinaryBase
  id: GasTemperaturePump
  name: temperature pump
  description: Moves heat from one pipeline to another. The input gets colder and the output gets hotter.
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: ExtensionCableReceiver
  - type: LightningTarget
    priority: 1
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: SubFloorHide
    visibleLayers:
    - enum.SubfloorLayers.FirstLayer
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/temperature_pump.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: tpump
      map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: AtmosPipeLayers
    spriteRsiPaths:
      Primary: _PS/Structures/Piping/Atmospherics/temperature_pump.rsi
      Secondary: _PS/Structures/Piping/Atmospherics/temperature_pump_alt1.rsi
      Tertiary: _PS/Structures/Piping/Atmospherics/temperature_pump_alt2.rsi
    alternativePrototypes:
      Primary: GasTemperaturePump
      Secondary: GasTemperaturePumpAlt1
      Tertiary: GasTemperaturePumpAlt2
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PumpVisuals.Enabled:
        enum.SubfloorLayers.FirstLayer:
          True: { state: tpumpOn }
          False: { state: tpump }
  - type: PipeColorVisuals
  - type: GasTemperaturePump
  - type: ActivatableUI
    key: enum.GasTemperaturePumpUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.GasTemperaturePumpUiKey.Key:
        type: GasTemperaturePumpBoundUserInterface
  - type: Construction
    graph: GasTemperature
    node: temperaturepump
  - type: AmbientSound
    enabled: false
    volume: -9
    range: 5
    sound:
      path: /Audio/Ambience/Objects/gas_pump.ogg
  - type: AtmosMonitoringConsoleDevice
    navMapBlip: Thermoregulator
  - type: GuideHelp
    guides:
    - TemperatureDevices

- type: entity
  parent: [ GasPipeLayerAlt1, GasTemperaturePump ]
  id: GasTemperaturePumpAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/temperature_pump_alt1.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: tpump
      map: [ "enum.SubfloorLayers.FirstLayer" ]
  - type: Construction
    node: temperaturepumpAlt1

- type: entity
  parent: [ GasPipeLayerAlt2, GasTemperaturePump ]
  id: GasTemperaturePumpAlt2
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _PS/Structures/Piping/Atmospherics/temperature_pump_alt2.rsi
