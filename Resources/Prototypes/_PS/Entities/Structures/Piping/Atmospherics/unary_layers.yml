# Palmtree: per-layer variants of the unary atmos devices, so the RPD and the construction
# menu can put a vent, scrubber, passive vent or injector on the same pipe layer as the pipes
# they connect to. The body sprite is inherited from the base prototype; only the connector
# stub moves to the alt RSI for that layer.

- type: entity
  parent: [ GasPipeLayerAlt1, GasVentPump ]
  id: GasVentPumpAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Construction
    node: ventpumpAlt1
  - type: AtmosPipeLayers
    pipeLayer: 1
  - type: Sprite
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeUnaryConnectors
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: vent_off
      map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]

