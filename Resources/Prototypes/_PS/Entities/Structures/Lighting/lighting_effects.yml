# Palmtree: flickering and rave light fixtures for dungeon decoration.
# Flickering fixtures spawn a flickering bulb; rave fixtures carry RaveLight directly and spawn a rave bulb.
# Rave variants pulse 100% -> 0% -> 100%; a screwdriver cycles the period through 0.5s, 1s and 2s.
# Always-powered variants work without APC power and still contain a replaceable bulb.

# Poweredlight
- type: entity
  parent: Poweredlight
  id: PoweredlightFlickering
  suffix: Flickering
  components:
  - type: PoweredLight
    hasLampOnSpawn: LightTubeFlickering

- type: entity
  parent: Poweredlight
  id: PoweredlightRave
  suffix: Rave
  components:
  - type: PoweredLight
    hasLampOnSpawn: LightTubeRave
  - type: RaveLight
    maxEnergy: 0.8

- type: entity
  parent: PoweredlightFlickering
  id: AlwaysPoweredlightFlickering
  suffix: Always Powered, Flickering
  components:
  - type: ApcPowerReceiver
    needsPower: false

- type: entity
  parent: PoweredlightRave
  id: AlwaysPoweredlightRave
  suffix: Always Powered, Rave
  components:
  - type: ApcPowerReceiver
    needsPower: false

