# Palmtree: coloured bulb-light fixtures for the RCDs. The base game only provides
# coloured tube fixtures; these reuse the existing crystal light bulbs.

- type: entity
  id: PoweredSmallLightCyan
  parent: PoweredSmallLight
  suffix: Cyan
  components:
  - type: PoweredLight
    hasLampOnSpawn: LightBulbCrystalCyan
  - type: PointLight
    color: "#47f8ff"

