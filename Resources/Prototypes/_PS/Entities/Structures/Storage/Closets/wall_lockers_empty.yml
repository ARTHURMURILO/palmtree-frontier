# Palmtree: buildable wall lockers.
# Only the player-facing `*Empty` variants are construction targets. The mapping bases
# (`LockerWallColor*`) and the filled variants deliberately have no recipe.
- type: entity
  id: LockerWallColorAmeEmpty
  parent: LockerWallColorAme
  suffix: Empty, Frontier
  components:
  - type: Construction
    graph: WallLocker
    node: LockerWallColorAmeEmpty
    containers:
    - storagebase
