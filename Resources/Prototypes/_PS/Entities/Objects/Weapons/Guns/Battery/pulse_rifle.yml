# Palmtree: prototype pulse rifle ported from Coyote (Floof) and re-added to the loot tables.
# Original: Resources/Prototypes/Floof/Entities/Objects/Weapons/Guns/Battery/battery_guns.yml (Coyote)

- type: entity
  name: prototype pulse rifle
  parent: [ BaseC3Contraband, NFBaseWeaponEnergyRifleHitScanPulse, NFBaseWeaponFrameEnergyRifleNanotrasen ]
  id: WeaponPrototypePulseRifle
  description: Some nutjob built this pulse rifle in their spess garage. It's quite power hungry. And why is it a lever action?!
  components:
  - type: Sprite
    sprite: _PS/Objects/Weapons/Guns/Battery/prototype_pulse_rifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Clothing
    sprite: _PS/Objects/Weapons/Guns/Battery/prototype_pulse_rifle.rsi
    slots:
    - Back
    - suitStorage
  - type: Gun
    fireRate: 2.0 # Coyote: 58 DPS, a lot more reasonable for a hitscan weapon.
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: HitscanBatteryAmmoProvider
    proto: PulseWeak
    fireCost: 80
  - type: Battery
    maxCharge: 2400
    startingCharge: 2400
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 4
  # Palmtree: recyclable - lathe recipe materials at a recovery rate.
  - type: PhysicalComposition
    materialComposition:
      Steel: 60
      Wood: 100
      Gold: 10
      Plasma: 20
