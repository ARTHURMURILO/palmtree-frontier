# Palmtree: flickering and rave bulbs. Insert one into any compatible light fixture.
# Rave bulbs pulse 100% -> 0% -> 100%; a screwdriver cycles the period through 0.5s, 1s and 2s.

# LightBulb
- type: entity
  parent: LightBulb
  id: LightBulbFlickering
  suffix: Flickering
  components:
  - type: FlickeringLight

- type: entity
  parent: LightBulb
  id: LightBulbRave
  suffix: Rave
  components:
  - type: RaveLight
    maxEnergy: 1

