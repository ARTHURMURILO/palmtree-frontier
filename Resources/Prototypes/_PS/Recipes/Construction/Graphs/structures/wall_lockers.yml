# Palmtree: buildable wall lockers.
# Only the player-facing `*Empty` variants are construction targets. The mapping bases
# (`LockerWallColor*`) and the filled variants deliberately have no recipe.
- type: constructionGraph
  id: WallLocker
  start: start
  graph:
  - node: start
    edges:
    - to: LockerWallColorAmeEmpty
      steps: &wallLockerBuildSteps
      - material: Steel
        amount: 4
      - material: Cable
        amount: 2
        doAfter: 5
    - to: LockerWallColorAtmosTechEmpty
      steps: *wallLockerBuildSteps
    - to: LockerWallColorBananiumEmpty
      steps: *wallLockerBuildSteps
