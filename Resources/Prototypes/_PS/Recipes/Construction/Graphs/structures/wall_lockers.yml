  - node: LockerWallColorAmeEmpty
    entity: LockerWallColorAmeEmpty
    edges:
    - &wallLockerDeconstruct
      to: start
      steps:
      - tool: Screwing
        doAfter: 5
      conditions:
      - !type:StorageWelded
        welded: false
