# Palmtree: whips ported from Coyote.
# Original: Resources/Prototypes/Floof/Entities/Objects/Lewd/whips.yml (Coyote)
# Only the whip set is ported; the matching paddles in the source file were left out.

- type: entity
  parent: BaseItem
  id: BaseWhip
  abstract: true
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 10
    # Flooftier - removed as frontier doesn't have the EE combat system.
    # heavyRateModifier: 0.5
    # heavyDamageBaseModifier: 1.75
    # heavyStaminaCost: 10
    # maxTargets: 1
    range: 6
    angle: 120
    heavyRangeOverride: 1.5
    requiresCombatMode: false
    animation: WeaponArcSlash
    soundHit:
      path: /Audio/Floof/Lewd/whip.ogg
  - type: Whip
    staminaDamage: 50
    outOfCombatStaminaDamage: 10
  - type: StaminaDamageOnCollide
    damage: 50
  - type: StaticPrice
    price: 60
  - type: Item
    size: Normal

- type: entity
  parent: BaseWhip
  id: WhipPink
  suffix: Coyote Frontier
  name: pink whip
  description: A pink whip for discipline!
  components:
  - type: Sprite
    sprite: Floof/Objects/Fun/Lewd/Weapons/whip_pink.rsi
    state: icon

- type: entity
  parent: BaseWhip
  id: WhipTeal
  suffix: Coyote Frontier
  name: teal whip
  description: A teal whip for discipline!
  components:
  - type: Sprite
    sprite: Floof/Objects/Fun/Lewd/Weapons/whip_teal.rsi
    state: icon

- type: entity
  parent: WhipPink
  id: WhipPinkHardy
  suffix: Palmtree
  name: hardy pink whip
  description: A sturdy pink whip for discipline!
  components:
  - type: MeleeWeapon
    range: 12
    damage:
      types:
        Slash: 50

- type: entity
  parent: WhipTeal
  id: WhipTealHardy
  suffix: Palmtree
  name: hardy teal whip
  description: A sturdy teal whip for discipline!
  components:
  - type: MeleeWeapon
    range: 12
    damage:
      types:
        Slash: 50

- type: entity
  parent: BaseWhip
  id: WhipPinkCrotch
  suffix: Coyote Frontier
  name: pink crotch whip
  description: A pink crotch whip for discipline!
  components:
  - type: Sprite
