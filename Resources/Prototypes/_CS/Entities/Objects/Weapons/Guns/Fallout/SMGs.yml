# Palmtree: SMGs ported from coyote-bayou. Generated by gen_guns.py.


- type: entity
  id: CSWeaponSubMachineGunUzi
  suffix: Coyote Bayou
  parent: [ CSBaseWeaponSubMachineGunChamber9mm, NFBaseWeaponFrameSubMachineGun ]
  name: Uzi
  description: A lightweight, burst-fire submachine gun, for when you really want someone dead. Uses 9mm rounds.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/Uzi.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/Uzi.rsi
  - type: Gun
    fireRate: 8.25
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/9mm.ogg
  - type: MagazineVisuals # Palmtree: magazine art from the BYOND source
    magState: mag
    steps: 2
    zeroVisible: true
  - type: StaticPrice
    price: 2600


