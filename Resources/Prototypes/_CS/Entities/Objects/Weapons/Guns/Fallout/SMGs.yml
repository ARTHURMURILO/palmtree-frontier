- type: entity
  id: CSWeaponSubMachineGunP90
  suffix: Coyote Bayou
  parent: [ CSBaseWeaponSubMachineGunChamber10mm, NFBaseWeaponFrameSubMachineGun ]
  name: P90
  description: The Fabrique Nationale P90c was just coming into use at the time of the war. The weapon's bullpup layout and compact design make it easy to control. Chambered in 10mm.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/P90.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/P90.rsi
  - type: Gun
    fireRate: 8.25
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    - SemiAuto
    shotsPerBurst: 3
    burstFireRate: 10.75
    soundGunshot:
      path: /Audio/_PS/Weapons/Guns/Gunshots/p90.ogg
  - type: ChamberMagazineAmmoProvider # Palmtree: CSS sound set
    soundRack:
      path: /Audio/_PS/Weapons/Guns/Bolt/p90_boltpull.ogg
    soundBoltOpened:
      path: /Audio/_PS/Weapons/Guns/Bolt/p90_boltpull.ogg
    soundBoltClosed:
      path: /Audio/_PS/Weapons/Guns/Bolt/p90_boltpull.ogg
  - type: ItemSlots # Palmtree: CSS sound set - must mirror CSBaseWeaponSubMachineGunChamber10mm
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CSMagazine10mmP90
        insertSound: /Audio/_PS/Weapons/Guns/MagIn/p90_clipin.ogg
        ejectSound: /Audio/_PS/Weapons/Guns/MagOut/p90_clipout.ogg
        priority: 2
        whitelist:
          tags:
          - CSMagazine10mmP90
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CSCartridge10mm
        priority: 1
        whitelist:
          tags:
          - CSCartridge10mm
  - type: GunDamageMultiplier # Palmtree: 1.25x damage
    multiplier: 1.25
  - type: MagazineVisuals # Palmtree: QA - mag states were blank/inherited steps
    magState: mag
    steps: 2
    zeroVisible: true
  - type: StaticPrice
    price: 3400


