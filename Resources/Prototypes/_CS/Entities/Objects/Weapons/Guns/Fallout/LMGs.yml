# Palmtree: LMGs ported from coyote-bayou. Generated by gen_guns.py.


- type: entity
  id: CSWeaponLightMachineGunBAR
  suffix: Coyote Bayou
  parent: [ CSBaseWeaponRifleChamber308, NFBaseWeaponFrameLightMachineGun ]
  name: BAR
  description: An ancient machine gun that looks outdated even by Pre-Fall standards. It is alarmingly heavy for a rifle.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/BAR.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/BAR.rsi
  - type: Gun
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - SemiAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/automaticrifle_BAR.ogg
  - type: MagazineVisuals # Palmtree: magazine art from the BYOND source
    magState: mag
    steps: 3
    zeroVisible: true
  - type: StaticPrice
    price: 4800


- type: entity
  id: CSWeaponLightMachineGunM1919
  suffix: Coyote Bayou
  parent: [ CSBaseWeaponRifleChamber308, NFBaseWeaponFrameLightMachineGun ]
  name: M1919
  description: This ancient machine gun has been dug up and put into working order by the Dallas Militia. It's loud, heavy and terrifying.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/M1919.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/M1919.rsi
  - type: Gun
    fireRate: 10 # Palmtree: QA - was 13.2, in line with the other belt-fed LMGs
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/assaultrifle_fire.ogg
  - type: MagazineVisuals # Palmtree: belt art from the BYOND source
    magState: mag
    steps: 5
    zeroVisible: true
  - type: ItemSlots # Palmtree: M1919 is belt-fed; spawns with the .308 drum
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CSMagazine308Rpd
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist: # Palmtree: fed from the .308 drum (the belt container), shared with the RPD
          tags:
          - CSMagazine308Rpd
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CSCartridge308
        priority: 1
        whitelist:
          tags:
          - CSCartridge308
  - type: StaticPrice
    price: 6000


- type: entity
  id: CSWeaponLightMachineGunRPD
  suffix: Coyote Bayou
  parent: [ CSBaseWeaponRifleChamber308, NFBaseWeaponFrameLightMachineGun ]
  name: RPD
  description: A soviet made Russian LMG. Known as the RPK, this LMG was chambered in 7.62 Soviet, now rechambered to .308 with a 100 round drum mag.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/RPD.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/RPD.rsi
  - type: Gun
    fireRate: 6.68
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/assaultrifle_fire.ogg
  - type: MagazineVisuals # Palmtree: drum art from the BYOND source; gun is magless while empty
    magState: mag
    steps: 2
    zeroVisible: true
  - type: ItemSlots # Palmtree: feeds from its 40-round drum, not from other .308 magazines
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CSMagazine308Rpd
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - CSMagazine308Rpd
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CSCartridge308
        priority: 1
        whitelist:
          tags:
          - CSCartridge308
  - type: StaticPrice
    price: 5200


