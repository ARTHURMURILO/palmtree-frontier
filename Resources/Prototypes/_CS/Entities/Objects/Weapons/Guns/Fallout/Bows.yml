# Palmtree: Bows ported from coyote-bayou. Generated by gen_guns.py.


- type: entity
  id: CSWeaponBowComposite
  suffix: Coyote Bayou
  parent: BaseBow
  name: composite bow
  description: An amalgamation of different materials - wood, animal horn and string - makes it faster to use. Can be stored within bags.
  components:
  - type: Contraband
    severity: Class2
    allowedDepartments: []
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/CompositeBow.rsi
    layers:
    - state: unwielded
      map: [ base ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.WieldableVisuals.Wielded:
        base:
          True: { state: wielded }
          False: { state: unwielded }
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/CompositeBow.rsi
  - type: Gun
    fireRate: 1.2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/bowfire.wav
  - type: StaticPrice
    price: 1200


- type: entity
  id: CSWeaponCrossbowMarksman
  suffix: Coyote Bayou
  parent: BaseCrossbowWieldable
  name: marksman crossbow
  description: A compact crossbow with a precision scope.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Guns/Fallout/MarksmanCrossbow.rsi
  - type: Clothing
    sprite: _CS/Objects/Weapons/Guns/Fallout/MarksmanCrossbow.rsi
  - type: ItemSlots # Palmtree: full slot - shallow merge would drop the parent's whitelist
    slots:
      projectiles:
        name: Projectiles
        startingItem: CrossbowBolt
        insertSound: /Audio/Weapons/Guns/Misc/arrow_nock.ogg
        whitelist:
          tags:
          - CrossbowBolt
          - CrossbowBoltBroadhead
          - CrossbowBoltGlassShard
          - CrossbowBoltPlasmaGlassShard
          - CrossbowBoltUraniumGlassShard
          - CrossbowBoltSyringe
          - CrossbowBoltPlasteel
          - CrossbowBoltExplosive
          - CrossbowBoltEMP
          - CrossbowBoltIncendiary
          - CrossbowBoltShrapnel
          - Plunger
          - Bread
          - MailCapsule
          - WeaponMeleeStake
  - type: Gun
    fireRate: 1
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_CS/Weapons/Fallout/bowfire.wav
  - type: StaticPrice
    price: 1600

